# Централизованные версии для плагинов Gradle (convention plugins).
# https://docs.gradle.org/current/userguide/platforms.html#sub:version-catalog

[versions]
kotlin = "2.4.20"
javaToolchain = "21"
junit = "5.11.4"

[libraries]
# Kotlin Gradle Plugin нужен, чтобы convention-плагины могли применить
# плагины org.jetbrains.kotlin.jvm / org.jetbrains.kotlin.multiplatform.
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }

[plugins]
# Переиспользуем маркеры плагинов KGP внутри convention-плагинов.
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
